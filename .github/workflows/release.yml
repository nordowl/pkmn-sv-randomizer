name: Release

# Run by hand from the Actions tab: enter a semantic version such as 1.2.0 or 1.3.0-beta.1.
# The workflow tests the code, builds the Windows app with that version, tags the commit
# v<version> and publishes a GitHub release with the installer and a portable zip.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (for example 1.2.0 or 1.3.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        shell: bash
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::'$VERSION' is not a semantic version such as 1.2.0 or 1.3.0-beta.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::The tag v$VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set the version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            for (const file of ["app/package.json", "app/src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
            const cargo = fs.readFileSync("Cargo.toml", "utf8");
            const updated = cargo.replace(/(\[workspace\.package\][^\[]*?\nversion = )"[^"]*"/, `$1"${version}"`);
            if (updated === cargo) throw new Error("no workspace version in Cargo.toml");
            fs.writeFileSync("Cargo.toml", updated);
          '

      - name: Test
        # Tests that need the real games skip themselves when SVR_TEST_KEYS is not set.
        run: cargo test --workspace --release

      - name: Install the UI dependencies
        working-directory: app
        run: npm ci

      - name: Check the UI
        working-directory: app
        run: npm run check

      - name: Build the app
        working-directory: app
        run: npx tauri build

      - name: Collect the release files
        shell: bash
        run: |
          mkdir -p dist-release
          cp target/release/bundle/nsis/*-setup.exe "dist-release/SV-Randomizer-$VERSION-setup.exe"
          7z a "dist-release/SV-Randomizer-$VERSION-portable.zip" "./target/release/SV Randomizer.exe"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SV Randomizer ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            Download **SV-Randomizer-${{ inputs.version }}-setup.exe** to install, or the portable zip to run it without installing.
            You need your own dump of Pokémon Scarlet or Violet with the 4.0.0 update and your own `prod.keys`. See the README for setup.
          files: dist-release/*
          fail_on_unmatched_files: true
